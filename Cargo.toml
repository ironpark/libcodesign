[package]
name = "zapp-rcodesign"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
apple-codesign = "=0.29.0"
# Ensure the archive includes compression code even when pkg-config finds host libraries.
bzip2-sys = { version = "0.1", features = ["static"] }
lzma-sys = { version = "0.1", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 0
# Without LTO the archive carries every object of every dependency -- the AWS
# SDK alone is 50 MB -- because nothing links it until a consumer does. Fat LTO
# keeps only what the two exported C functions reach: 122 MB down to 25 MB.
lto = "fat"
codegen-units = 1

[dev-dependencies]
chrono = "0.4"
pem = "3"
tempfile = "3"
x509-certificate = "0.24"
