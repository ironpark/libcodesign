name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version used in the release archive names.
        type: string
        default: dev
      upload:
        description: Upload the packaged archives as workflow artifacts.
        type: boolean
        default: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux_amd64
          - runner: ubuntu-22.04-arm
            target: linux_arm64
          - runner: windows-2025
            target: windows_amd64
            llvm_host: x86_64
          - runner: windows-11-arm
            target: windows_arm64
            llvm_host: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '2'
      LIBCODESIGN_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Install LLVM MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = 'llvm-mingw-20260908-ucrt-${{ matrix.llvm_host }}'
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$name.zip" -OutFile "$env:RUNNER_TEMP/llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP/llvm-mingw.zip" "$env:RUNNER_TEMP/llvm-mingw"
          "$env:RUNNER_TEMP/llvm-mingw/$name/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          # A lockfile change should still start from the previous build's
          # artifacts rather than recompiling the whole dependency tree.
          restore-keys: rust-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-
      - name: Build, test and link-check the static library
        run: python scripts/build.py ${{ matrix.target }} --test --strip --smoke
      - name: Generate license notices
        shell: bash
        env:
          LLVM_HOST: ${{ matrix.llvm_host }}
        run: |
          # Cached binaries may exist without Cargo installation metadata.
          # --force also replaces binaries built for a previous target.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Match the build's MinGW toolchain instead of the host MSVC
            # target, whose ARM64 C headers are not configured here.
            target="${LLVM_HOST}-pc-windows-gnullvm"
            compiler="${LLVM_HOST}-w64-mingw32-clang"
            CC="$compiler" AR=llvm-ar cargo install cargo-about --locked --version 0.8.4 --force \
              --target "$target" --config "target.$target.linker=\"$compiler\""
          else
            cargo install cargo-about --locked --version 0.8.4 --force
          fi
          cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Package release archive
        run: python scripts/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: libcodesign-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          # The archive is already gzipped; a second pass only costs time.
          compression-level: 0
